# upsmon.conf — NUT client monitoring a UPS shared by an Asustor NAS.
# Install to /opt/homebrew/etc/nut/upsmon.conf and edit the MONITOR line:
#   MONITOR <upsname>@<nas-ip> 1 <user> <password> secondary
# <user>/<password> = the NUT account set in ADM (External Devices > UPS > Preferences); a rejected
# login is harmless but means the NAS cannot count this Mac as a secondary — see TROUBLESHOOTING.md
MONITOR ASUSTOR-UPS-MYNAS@192.168.1.100 1 monitor CHANGE_ME_readonly secondary
MINSUPPLIES 1
SHUTDOWNCMD "/sbin/shutdown -h now"
POWERDOWNFLAG /etc/killpower

NOTIFYCMD "/opt/homebrew/etc/nut/notify.sh"
NOTIFYFLAG ONLINE   SYSLOG+EXEC
NOTIFYFLAG ONBATT   SYSLOG+EXEC
NOTIFYFLAG LOWBATT  SYSLOG+EXEC
NOTIFYFLAG FSD      SYSLOG+EXEC
NOTIFYFLAG COMMOK   SYSLOG+EXEC
NOTIFYFLAG COMMBAD  SYSLOG+EXEC
NOTIFYFLAG SHUTDOWN SYSLOG+EXEC
NOTIFYFLAG REPLBATT SYSLOG+EXEC
NOTIFYFLAG NOCOMM   SYSLOG+EXEC
NOTIFYFLAG NOPARENT SYSLOG+EXEC
